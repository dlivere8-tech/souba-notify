name: 毎朝相場通知

on:
  schedule:
    - cron: '0 21 * * 0-4'  # JST月〜金 6:00 = UTC日〜木 21:00
  workflow_dispatch:  # 手動実行用

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # docs/data/ のコミット・プッシュに必要
    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリインストール
        run: pip install yfinance pandas requests beautifulsoup4 pytz gspread google-auth pandas-ta duckdb

      - name: 日付取得
        id: date
        run: echo "today=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: DBキャッシュ復元
        uses: actions/cache/restore@v4
        with:
          path: /tmp/stock_prices.duckdb
          key: souba-db-${{ steps.date.outputs.today }}
          restore-keys: |
            souba-db-

      - name: DB初回セットアップ（キャッシュなし時のみ）
        run: |
          if [ ! -f /tmp/stock_prices.duckdb ]; then
            echo "DBが見つかりません。GitHubリリースから初期DBをDL..."
            curl -fL -o /tmp/stock_prices.duckdb \
              "https://github.com/${{ github.repository }}/releases/download/db-bootstrap/stock_prices.duckdb" \
              || { echo "初期DBのDLに失敗しました。手順: https://github.com/${{ github.repository }}/releases/new でdb-bootstrapタグを作成してDBをアップロードしてください"; exit 1; }
            echo "初期DB DL完了: $(du -sh /tmp/stock_prices.duckdb | cut -f1)"
          else
            echo "DB復元済み: $(du -sh /tmp/stock_prices.duckdb | cut -f1)"
          fi

      - name: 相場通知実行
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          SEND_TO:        ${{ secrets.SEND_TO }}
        run: python souba.py

      - name: JSONデータをコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: results $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: DBキャッシュ保存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/stock_prices.duckdb
          key: souba-db-${{ steps.date.outputs.today }}
